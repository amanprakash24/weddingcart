<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Playfair+Display:ital,wght@1,500&display=swap">
<style>html,body{margin:0;width:1200px;height:630px;overflow:hidden}
.bg{position:absolute;inset:0;background:url(floral-arch.jpg) center 42%/cover}
.w{position:absolute;inset:0;background:radial-gradient(48% 62% at 50% 50%,rgba(251,246,238,.97),rgba(251,246,238,.9) 60%,rgba(251,246,238,.2))}
.c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center}
img{width:190px}
.k{font:600 18px Cinzel;letter-spacing:.3em;color:#8a5f1f;text-transform:uppercase}
.n{font:italic 500 78px 'Playfair Display';color:#6d2c4c;line-height:1.1}
.d{font:600 20px Cinzel;letter-spacing:.18em;color:#3b1a2b}</style></head><body>
<div class="bg"></div><div class="w"></div><div class="c"><img src="monogram.png" alt=""><div class="k">{{LABEL}}</div>
<div class="n">{{NAMES}}</div><div class="d">{{LINE}}</div></div></body></html>
